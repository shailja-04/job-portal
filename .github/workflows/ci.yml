name: Java CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. BUILD & TEST JOB
  # Sets up JDK 21, starts a real PostgreSQL container service, compiles,
  # executes all unit & integration tests, and generates the production JAR.
  # =========================================================================
  test-and-build:
    name: Build & Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobportal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Build, Test & Package with Maven
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/jobportal
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: ./mvnw clean verify

      - name: Upload Surefire Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Archive Production JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: job-portal-jar
          path: target/*.jar
          retention-days: 7

  # =========================================================================
  # 2. DOCKER IMAGE BUILD JOB
  # Ensures the multi-stage Dockerfile builds cleanly and packages the app.
  # =========================================================================
  docker-build:
    name: Build Docker Image
    needs: test-and-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t job-portal:latest .
